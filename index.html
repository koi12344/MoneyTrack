<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyTrack - 个人记账</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="welcome" hidden>
        <h1>MoneyTrack</h1>
        <p>想怎么记账？</p>
        <button id="chooseSimple">简洁版 —— 只记账，够用</button>
        <button id="chooseFull">综合版 —— 记账 + 分析 + 储蓄</button>
    </div>

    <div id="app">
        <h1>MoneyTrack</h1>
        <p><button id="modeToggleBtn">切换模式</button></p>

        <h2>我的记账目标</h2>
        <p>写下你使用 MoneyTrack 的原因吧：</p>
        <input type="text" id="goalInput" placeholder="请输入你的记账目标">
        <button id="saveGoalBtn">保存目标</button>

        <h2>收支总览</h2>
        <p>今日支出：<span id="todayExpense">0.00</span> 元</p>
        <p>今日收入：<span id="todayIncome">0.00</span> 元</p>
        <p>本月支出：<span id="monthExpense">0.00</span> 元</p>
        <p>本月收入：<span id="monthIncome">0.00</span> 元</p>
        <p>本月结余：<span id="monthBalance">0.00</span> 元</p>

        <div class="full-only">
            <h2>本月预算</h2>
            <p><input type="number" id="budgetInput" placeholder="设置本月预算" min="0" step="0.01"> <button id="budgetBtn">保存</button></p>
            <p>已支出 <span id="budgetSpent">0.00</span> 元　剩余 <span id="budgetLeft">0.00</span> 元</p>
            <div class="stat-bar-wrap"><div id="budgetBar" class="stat-bar"></div></div>

            <h3>分类预算</h3>
            <p><input list="categoryList" id="catBudgetCategory" placeholder="分类"> <input type="number" id="catBudgetAmount" placeholder="金额" min="0" step="0.01"> <button id="catBudgetBtn">加预算</button></p>
            <ul id="catBudgetList"></ul>
        </div>

        <h2>记一笔</h2>
        <label><input type="radio" name="type" value="expense" checked> 支出</label>
        <label><input type="radio" name="type" value="income"> 收入</label>
        <input type="number" id="amountInput" placeholder="金额" min="0" step="0.01">
        <input list="categoryList" id="categoryInput" placeholder="分类（可自己输入）">
        <datalist id="categoryList"></datalist>
        <input type="date" id="dateInput">
        <input type="text" id="noteInput" placeholder="备注（可选）">
        <input type="text" id="locationInput" placeholder="地点（可选）">
        <label><input type="checkbox" id="saveAsTpl"> 存为固定模板</label>
        <button id="addBtn">记一笔</button>
        <button id="cancelBtn" hidden>取消</button>

        <h2>账单列表</h2>
        <p id="filterHint" hidden><span id="filterName"></span> <button id="clearFilterBtn">看全部</button></p>
        <ul id="transactionList"></ul>

        <div class="full-only">
            <h2>本月支出分类统计</h2>
            <ul id="categoryStats"></ul>

            <h2>储蓄目标</h2>
            <p>
                <input type="text" id="goalName" placeholder="目标名称">
                <input type="number" id="goalTarget" placeholder="目标金额" min="0" step="0.01">
                <input type="number" id="goalCurrent" placeholder="当前金额" min="0" step="0.01">
                <button id="goalBtn">添加目标</button>
            </p>
            <ul id="goalList"></ul>

            <h2>有效记账日</h2>
            <p>本月已记录 <span id="checkinCount">0</span> 天　<span id="checkinStatus"></span></p>
            <div id="calendar" class="calendar"></div>
            <p><button id="noSpendBtn">今日无收支</button> <span id="noSpendHint"></span></p>

            <h2>固定收支模板</h2>
            <p>
                <input type="text" id="tplName" placeholder="名称（如：房租）">
                <label><input type="radio" name="tplType" value="expense" checked>支出</label>
                <label><input type="radio" name="tplType" value="income">收入</label>
                <input type="number" id="tplAmount" placeholder="金额" min="0" step="0.01">
                <input type="text" id="tplCategory" placeholder="分类（可选）">
                <button id="tplBtn">添加模板</button>
            </p>
            <ul id="tplList"></ul>
        </div>

    </div>

    <script src="js/app.js"></script>

</body>
</html>
